<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .calculator {
      width: min(100%, 22rem);
      padding: 1.25rem;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      background: #1e293b;
      box-shadow: 0 1.5rem 4rem #02061780;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .display {
      width: 100%;
      min-height: 5rem;
      margin-bottom: 1rem;
      padding: 1rem;
      overflow: hidden;
      border: 0;
      border-radius: 0.75rem;
      background: #0f172a;
      color: #f8fafc;
      font: inherit;
      font-size: 2rem;
      text-align: right;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
    }

    button {
      min-height: 3.75rem;
      border: 0;
      border-radius: 0.75rem;
      background: #334155;
      color: inherit;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover { background: #475569; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
    .utility { background: #475569; }
    .operator { background: #0369a1; }
    .operator:hover { background: #0284c7; }
    .equals { grid-column: span 2; background: #16a34a; }
    .equals:hover { background: #22c55e; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <input class="display" id="display" type="text" value="0" aria-label="Calculator display" readonly>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-operator="/" aria-label="Divide">÷</button>
      <button class="operator" data-operator="*" aria-label="Multiply">×</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="-" aria-label="Subtract">−</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button data-action="sign" aria-label="Toggle sign">±</button>

      <button data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let current = "0";
    let stored = null;
    let operator = null;
    let startNewNumber = false;

    function updateDisplay() {
      display.value = current;
    }

    function enterDigit(digit) {
      if (current === "Error" || startNewNumber) {
        current = digit;
        startNewNumber = false;
      } else if (current === "0") {
        current = digit;
      } else if (current.length < 14) {
        current += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (current === "Error" || startNewNumber) {
        current = "0.";
        startNewNumber = false;
      } else if (!current.includes(".")) {
        current += ".";
      }
      updateDisplay();
    }

    function calculate() {
      if (operator === null || stored === null) return;
      const left = stored;
      const right = Number(current);
      let result;

      switch (operator) {
        case "+": result = left + right; break;
        case "-": result = left - right; break;
        case "*": result = left * right; break;
        case "/": result = right === 0 ? NaN : left / right; break;
      }

      current = Number.isFinite(result)
        ? String(Number(result.toPrecision(10)))
        : "Error";
      stored = null;
      operator = null;
      startNewNumber = true;
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (current === "Error") return;
      if (operator !== null && !startNewNumber) calculate();
      stored = Number(current);
      operator = nextOperator;
      startNewNumber = true;
    }

    function clear() {
      current = "0";
      stored = null;
      operator = null;
      startNewNumber = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === "clear") clear();
      if (action === "delete") {
        if (current === "Error" || startNewNumber) {
          current = "0";
          startNewNumber = false;
        } else {
          current = current.length > 1 ? current.slice(0, -1) : "0";
          if (current === "-") current = "0";
        }
        updateDisplay();
      }
      if (action === "decimal") enterDecimal();
      if (action === "sign" && current !== "Error") {
        current = String(Number(current) * -1);
        updateDisplay();
      }
      if (action === "equals") calculate();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") handleAction("equals");
      else if (event.key === "Backspace") handleAction("delete");
      else if (event.key === "Escape") handleAction("clear");
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
